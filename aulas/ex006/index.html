<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarquia de Titulos</title>
</head>
<body>
    <h1>Título Principal</h1>
    <h2>Subtítulo 1</h2>
    <h3>Subtítulo 1.1</h3>
    <h3>Subtítulo 1.2</h3>
    <h2>Subtítulo 2</h2>
    <h3>Subtítulo 2.1</h3>
    <h3>Subtítulo 2.2</h3>
    <h4>Subtítulo 2.2.1</h4>
    <!--os titulos possuem uma hierarquia que vai do h1 ao h6-->
</body>
</html>
