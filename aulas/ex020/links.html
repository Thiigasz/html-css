<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

    /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = clildren
    */
    
        body {
            font-family: Arial, Helvetica, sans-serif
        }

        a {
            color: red; /* Cor do link */
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred; /* Cor do link visitado */
        }

        a:hover {
            color: black; /* Cor do link ao passar o mouse */
            text-decoration: underline;
        }

        a:active {
            color: blue; /* Cor do link ativo */
        }

        a::before { /* Pseudo-elemento para adicionar texto antes do link */
            content: " ➡ ";
        }

        a::after { /* Pseudo-elemento para adicionar texto após o link */
            content: " [link]";
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/Thiigasz" target="_blank">GitHub</a></li>
        <li><a href="https://www.youtube.com/@Thiigasz" target="_blank">YouTube</a></li>
        <li><a href="https://www.twitch.tv/Thiigasz" target="_blank">Twitch</a></li>
    </ul>
</body>
</html>
