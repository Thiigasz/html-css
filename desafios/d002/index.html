<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icone.png"> <!--A tag <link> é bem versátil — ela serve pra várias coisas diferentes, e o que muda o "papel" dela é o atributo rel (relationship, ou seja, qual é a relação desse link com a página).

Os valores de rel mais comuns que você vai usar no dia a dia: <rel>	Pra que serve?
icon:	Define o favicon (ícone da aba);
stylesheet:	Importa um arquivo CSS externo;
preconnect:	Otimiza conexão antecipada com um domínio (ex: fontes do Google);
manifest:	Aponta pro arquivo .json de PWA (Progressive Web App);
canonical:	Indica a URL "oficial" da página (importante pra SEO);
apple-touch-icon:	Ícone específico pra quando salvam a página na tela do iPhone/iPad.-->
    <title>Imagens</title>
</head>
<body>
<h1>Desafio das Imagens</h1>
<p>Inserir imagens em HTML e muito simples, tanto no conteudo quanto <br> em cima como icone de favoritos!</p>
<img src="github-m.png" alt="Logo Github">
</body>
</html>
