    <title>Desafio das Tags</title>

<body>
  <h1>Tags em HTML</h1> 
  <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o  mouse <br> sobre os elementos para descobrir qual tag deverá utilizar em cada caso.</p> 
  <ul type = "square">
    <li> <p>Texto em <abbr title="use a tag     <strong>">Negrito</abbr></p></li>
     <li> <p>Texto em <abbr title="use a tag     <em>">Itálico</abbr></p></li>
    <li> <p>Texto <abbr title="use a tag     <u>">Sublinhado</abbr></p></li>
    <li> <p>Texto <abbr title="use a tag     <mark>">Marcado</abbr></p></li>
    <li> <p>Texto <abbr title="use a tag     <del>">Riscado</abbr></p></li>
    <li><p><abbr title="use a tag     <p>">Parágrafo</abbr></p></li>

  </ul>
</body>
</html>
