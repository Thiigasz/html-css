<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <caption>
            Resultados
        </caption>
        <thead>
            <tr>
                <th rowspan="3">Área</th>
                <th rowspan="3">Disciplinas</th>
                <th>Notas <br> Nota 1 Nota 2</th>
                <th>Média</th>
            </tr>
        </thead>
        <tbody>
            <th>Exatas</th>
            <td>Matemática</td>
            <td>Física</td>
            <td>Química</td>
            <td>Biologia</td>
        </tbody>
    </table>
</body>
</html>
