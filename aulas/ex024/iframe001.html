<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
    <!--Tamanho padrão é de 300x150 -->
    <!-- paramêtros:
     frameborder (0 ou qualquer outra coisa);
     height (altura do iframe);
     scolling (auto -> padrão:se o conteúdo exceder o tamanho do frame ele vai criar a barra de rolagem;
     yes -> mesmo que o conteúdo estiver cabendo dentro do frame vai aparecer a barra de rolagem;
     no -> mesmo que o conteúdo seja maior ele não vai permitir a barra de rolagem, porem depende do navegador ).
      -->
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="no"></iframe>
        para aprender a programar</p>
    
    <p>O site do <iframe src="https://www.google.com" frameborder="0"><a href="https://www.google.com" target="_blank"> Google</a></iframe> também é muito legal!</p> <!-- existem sites que tem protecão para que seu conteúdo não seja usado em iframes--> 

    <p>O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500"></iframe> também é bem legal!
    </p>
</body>
</html>
