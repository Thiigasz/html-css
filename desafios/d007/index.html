<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Imagem Flexível</title>
</head>
<body>
  <h1>Imagem Flexível</h1>  
  <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para ver a mágica acontecer!</p>
  <picture>
    <source media="(max-width:550px)" srcset="imagens/imagem-p.jpg">
    <source media="(max-width:1250px )" srcset="imagens/imagem-m.jpg">
    <img src="imagens/imagem-g.jpg" alt="Imagem Flexível">
  </picture>
</body>
</html>
