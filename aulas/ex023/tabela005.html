<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }


        col.cnome, col.cprof {
            background-color: chocolate;
        }

        col.cgrupo {
            background-color: cornflowerblue;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2"> <!-- span pede a quantidade de expansao da cooluna, no caso duas ou mais colunas terao a mesma cor definida por vc-->
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Tainah</td>
            <td>F</td>
            <td>23</td>
            <td>Enfermeira</td>
        </tr>
        <tr>
            <td>Thiago</td>
            <td>M</td>
            <td>26</td>
            <td>Desenvolvedor</td>
        </tr>
        <tr>
            <td>Reinan</td>
            <td>M</td>
            <td>23</td>
            <td>Auxiliar de Producão</td>
        </tr>
        <tr>
            <td>Camile</td>
            <td>F</td>
            <td>24</td>
            <td>Supervisora bancária</td>
        </tr>
        <tr>
            <td>Clara</td>
            <td>F</td>
            <td>22</td>
            <td>Operadora bancária</td>
        </tr>

    </table>
</body>
</html>
